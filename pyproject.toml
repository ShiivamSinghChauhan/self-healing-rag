[project]
name = "self-healing-rag"
version = "0.1.0"
description = "Self-healing RAG over company documents: LangGraph loop, hybrid search, Jev decision checks"
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "onnxruntime>=1.31.1",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "rapidocr>=3.10.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.3",
]
